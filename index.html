function sim(ps,rho,add,thr,n){

  svg.innerHTML=`<defs><pattern id="pD" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" style="fill:var(--line)"/><rect width="3.5" height="7" style="fill:var(--dem)"/></pattern><pattern id="pR" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" style="fill:var(--line)"/><rect width="3.5" height="7" style="fill:var(--rep)"/></pattern><pattern id="pU" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" style="fill:var(--bg)"/><rect width="2" height="7" style="fill:var(--mute)"/></pattern></defs>`+h;$("mapLg").innerHTML=lg.join("");
  $("mapNote").innerHTML=fill(t(T==="H"?(view==='geo'&&CD?'mapNHg':'mapNH'):T==="S"?'mapNS':'mapNG'));
}
function render(){
  if(!D0.N0&&D0.N0!==0)return;
  $("natO").textContent="D+"+(+$("nat").value).toFixed(1);$("fwO").textContent=$("fw").value+"%";
  compute();
  const h=calc.h,s=calc.s,g=calc.g;
  $("hExp").textContent=Math.round(h.mean);$("hCtl").textContent=pct(h.ctl);$("hRng").textContent=h.lo+"–"+h.hi;$("hBar").style.width=Math.min(100,h.mean/435*100)+"%";
  $("sExp").textContent=s.mean.toFixed(1);$("sCtl").textContent=pct(s.ctl);$("sRng").textContent=s.lo+"–"+s.hi;$("sBar").style.width=s.mean+"%";
  $("gExp").textContent=g.mean.toFixed(1);$("gCtl").textContent=pct(g.ctl);$("gBar").style.width=g.mean/50*100+"%";
  histSvg($("hSvg"),h,D0.fixed_dem-17,D0.fixed_dem+78);histSvg($("sSvg"),s,41,62);
  const T=state.tab;$("cH").hidden=T!=="H";$("cS").hidden=T!=="S";$("cG").hidden=T!=="G";$("dH").hidden=T!=="H";$("dS").hidden=T!=="S";
  ["tH","tS","tG"].forEach(i=>$(i).setAttribute("aria-pressed",i==="t"+T));
  mapRender();table();trend();
}
function table(){
  const tb=state.tab;let rows;
  const cols=[["name",tb==="H"?t('district'):t('state')],["fpo","FPO"],["pm","PM"],["ck","Cook"],["fund",t('fund')],["comp",t('comp')],["rate",t('rate')]];
  const ckl=ckl2;
  if(tb==="H")rows=H.map(h=>({n:h.id,name:h.id+(h.terms<3?`<span class="tag" style="margin-left:6px" title="${lang==='zh'?(h.terms===1?'仅用总统选举差':'3 项中用 2 项'):(h.terms===1?'presidential margin only':'2 of 3 terms')}">${h.terms}t</span>`:""),fpo:h.fA,pm:h.pA,ck:ckl(h.ck),fund:h.fund,comp:h.comp,cookP:h.cookP}));
  if(tb==="H"){if(!state.close)rows=rows.concat(AL.filter(d=>!d.h).map(d=>({n:d.id,name:d.id,fpo:null,pm:null,ck:'–',fund:null,comp:d.c,cookP:null})))}
  else if(tb==="S")rows=S.map(x=>({n:x.id,name:sname(x.id),fpo:x.fA,pm:x.pA,ck:ckl(x.ck),fund:x.fund,comp:x.comp,cookP:x.cookP}));
  else rows=G.map(x=>({n:x.id,name:sname(x.id),fpo:null,pm:x.pA,ck:ckl(x.ck),fund:x.fund,comp:x.comp,cookP:x.cookP}));
  if(state.close)rows=rows.filter(r=>r.comp>=.2&&r.comp<=.8);
  const key=state.sort==="rate"?"comp":state.sort;rows.sort((a,b)=>{const va=key==="name"?a.n:key==="ck"?a.cookP:a[key],vb=key==="name"?b.n:key==="ck"?b.cookP:b[key];return ((va??-1)>(vb??-1)?1:-1)*state.dir});
  $("thead").innerHTML="<tr>"+cols.map(c=>`<th scope="col" data-k="${c[0]}">${c[1]}${state.sort===c[0]?(state.dir<0?" ↓":" ↑"):""}</th>`).join("")+"</tr>";
  $("tbody").innerHTML=rows.map(r=>`<tr><td>${r.name}</td><td class="n">${r.fpo==null?"–":Math.round(r.fpo*100)}</td><td class="n">${r.pm==null?"–":Math.round(r.pm*100)}</td><td>${r.ck}</td><td class="n">${r.fund==null?"–":Math.round(r.fund*100)}</td><td>${compCell(r.comp)}</td><td>${rateCell(r.comp)}</td></tr>`).join("")||`<tr><td colspan=7>${t('none')}</td></tr>`;
}
function lines(rows,series,lo,hi,band){
  const W=400,Hh=150,pl=30,pr=8,pt=8,pb=22,n=rows.length,X=i=>pl+(n===1?0:i*(W-pl-pr)/(n-1)),Y=v=>pt+(hi-v)/(hi-lo)*(Hh-pt-pb);let s="";
  const st=(hi-lo)>60?20:(hi-lo)>15?5:2;
  for(let v=Math.ceil(lo/st)*st;v<=hi;v+=st)s+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width=".6"/><text x="${pl-4}" y="${Y(v)+3}" text-anchor="end">${v}</text>`;
  if(band){const [a,b]=band;s+=`<path class="bd" fill="${series[0].c}" d="M${rows.map((r,i)=>X(i)+","+Y(r[b])).join("L")}L${rows.map((r,i)=>X(rows.length-1-i)+","+Y(rows[rows.length-1-i][a])).join("L")}Z"/>`}
  series.forEach(se=>{s+=`<path class="ln" stroke="${se.c}" d="M${rows.map((r,i)=>X(i)+","+Y(r[se.k])).join("L")}"/>`;rows.forEach((r,i)=>{s+=`<circle cx="${X(i)}" cy="${Y(r[se.k])}" r="2.4" fill="${se.c}"/>`})});
  s+=`<text x="${X(0)}" y="${Hh-6}">${rows[0].date.slice(5)}</text><text x="${X(n-1)}" y="${Hh-6}" text-anchor="end">${rows[n-1].date.slice(5)}</text>`;
  return `<svg viewBox="0 0 ${W} ${Hh}">${s}</svg>`;
}
function trend(){
  const el=$("trBody");
  if(HIST.length<2){el.innerHTML=`<div class="empty">${t('trEmpty')}</div>`;return}
  const T=state.tab,R=HIST.map(r=>({...r,hc:r.house_ctl*100,sc:r.senate_ctl*100,gc:r.gov_maj*100}));
  const rg=ks=>{const v=R.flatMap(r=>ks.map(x=>r[x]));return[Math.floor(Math.min(...v)-3),Math.ceil(Math.max(...v)+3)]};
  let c1,c2;
  if(T==="H"){const [l,h]=rg(['house_lo','house_hi']);c1=`<div class="card"><h2>${t('trH')}</h2>${lines(R,[{k:'house_mean',c:'var(--dem)'}],l,h,['house_lo','house_hi'])}</div>`;c2=`<div class="card"><h2>${t('trC')}</h2>${lines(R,[{k:'hc',c:'var(--dem)'}],0,100)}</div>`}
  else if(T==="S"){const [l,h]=rg(['senate_lo','senate_hi']);c1=`<div class="card"><h2>${t('trS')}</h2>${lines(R,[{k:'senate_mean',c:'var(--dem)'}],l,h,['senate_lo','senate_hi'])}</div>`;c2=`<div class="card"><h2>${t('trC')}</h2>${lines(R,[{k:'sc',c:'var(--dem)'}],0,100)}</div>`}
  else{const [l,h]=rg(['gov_mean']);c1=`<div class="card"><h2>${t('trG')}</h2>${lines(R,[{k:'gov_mean',c:'var(--dem)'}],Math.max(0,l),Math.min(50,h))}</div>`;c2=`<div class="card"><h2>${t('trC')}</h2>${lines(R,[{k:'gc',c:'var(--dem)'}],0,100)}</div>`}
  el.innerHTML=`<div class="chartwrap">${c1}${c2}</div>`;
}
async function init(){
  try{lang=localStorage.getItem('lang')||'en'}catch(e){lang='en'}
  try{D0=await (await fetch('data.json',{cache:'no-store'})).json()}catch(e){document.body.insertAdjacentHTML('afterbegin','<p style="padding:20px">data.json could not be loaded. Open this page through a web server.</p>');return}
  try{HIST=await (await fetch('history.json',{cache:'no-store'})).json()}catch(e){HIST=[]}
  H=D0.H.split(";").map(r=>{const a=r.split(",");return{id:a[0],f:+a[1],pm:+a[2]<0?null:+a[2],ck:a[3],base:Math.max(-30,Math.min(30,+a[4])),terms:+a[5]}});
  try{CN=await (await fetch('cands.json')).json()}catch(e){CN=null}
  try{CD=await (await fetch('cd.json')).json()}catch(e){CD=null}
  try{MP=await (await fetch('map.json')).json()}catch(e){MP={p:{},l:{}}}
  const lst=H.map(h=>({id:h.id,st:h.id.slice(0,2),h}));
  AL=lst.concat((D0.A||'').split(';').filter(Boolean).map(r=>{const a=r.split(',');return{id:a[0],st:a[0].slice(0,2),c:+a[1]}})).sort((a,b)=>a.id<b.id?-1:1);
  S=D0.S.map(a=>({id:a[0],f:a[1],pm:a[2],ck:a[3],tr:a[4]}));
  G=D0.G.map(a=>({id:a[0],pm:a[1],ck:a[2],tr:a[3]}));
  $("nat").value=D0.N0;
  $("nat").addEventListener("input",render);$("fw").addEventListener("input",render);
  $("rst").addEventListener("click",()=>{$("nat").value=D0.N0;$("fw").value=25;render()});
  $("lang").addEventListener("click",()=>{lang=lang==='zh'?'en':'zh';applyLang()});
  $("thead").addEventListener("click",e=>{const k=e.target.closest("th")?.dataset.k;if(!k)return;if(state.sort===k)state.dir*=-1;else{state.sort=k;state.dir=k==="name"?1:-1}table()});
  const HM={house:"H",senate:"S",governors:"G"},HR={H:"house",S:"senate",G:"governors"};
  const setTab=tb=>{state.tab=tb;state.sort="comp";state.dir=-1;try{history.replaceState(null,"","#"+HR[tb])}catch(e){}render()};
  [["tH","H"],["tS","S"],["tG","G"]].forEach(([id,tb])=>$(id).addEventListener("click",()=>setTab(tb)));
  if(HM[location.hash.slice(1)])state.tab=HM[location.hash.slice(1)];
  const setF=v=>{state.close=v;$("fC").setAttribute("aria-pressed",v);$("fA").setAttribute("aria-pressed",!v);table()};
  $("fC").addEventListener("click",()=>setF(true));$("fA").addEventListener("click",()=>setF(false));
  $("zm").addEventListener("click",()=>{if(zoomD)zoomD=null;else zoomK="us";mapRender()});
  $("mapSvg").addEventListener("click",e=>{if(state.tab!=="H"||view!=="geo")return;const el=e.target.closest("[data-k]");if(!el)return;const id=el.dataset.k.split(":")[1],st=id.slice(0,2);if(!MP.p[st])return;if(st!==zoomK){zoomK=st;zoomD=null;mapRender()}else if(zoomD!==id){zoomD=id;mapRender()}});
  $("vw").addEventListener("click",()=>{view=view==='geo'?'tile':'geo';render()});
  const tip=$("tip"),svgm=$("mapSvg");
  const show=e=>{const el=e.target.closest("[data-k]");if(!el){tip.hidden=true;return}tip.innerHTML=tipFor(el.dataset.k);tip.hidden=false;const w=tip.offsetWidth,hh=tip.offsetHeight;let x=e.clientX+14,y=e.clientY+14;if(x+w>innerWidth-8)x=e.clientX-w-14;if(y+hh>innerHeight-8)y=e.clientY-hh-14;tip.style.left=Math.max(4,x)+"px";tip.style.top=Math.max(4,y)+"px"};
  svgm.addEventListener("mousemove",show);svgm.addEventListener("click",show);svgm.addEventListener("mouseleave",()=>{tip.hidden=true});
  document.addEventListener("click",e=>{if(!e.target.closest("#mapSvg"))tip.hidden=true});
  applyLang();
}
init();
</script></body></html>
